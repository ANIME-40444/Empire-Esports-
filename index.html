<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMPIRE ESPORTS CHAMPION</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top,#ff6a00 0%,transparent 25%),
linear-gradient(135deg,#000,#08111f,#000);
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.card{
max-width:800px;
width:100%;
padding:50px 30px;
border-radius:30px;
background:rgba(255,255,255,.04);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 50px rgba(255,106,0,.25);
}

.trophy{
font-size:90px;
animation:float 3s ease-in-out infinite;
}

.winner{
font-family:'Orbitron',sans-serif;
font-size:4rem;
font-weight:900;
margin-top:15px;
color:#ffd700;
text-shadow:
0 0 15px #ffd700,
0 0 40px #ffd700;
}

.team{
font-family:'Orbitron',sans-serif;
font-size:3rem;
font-weight:800;
margin-top:20px;
color:#ff7b00;
text-shadow:
0 0 15px #ff7b00,
0 0 50px #ff7b00;
}

.prize{
margin-top:25px;
font-size:1.5rem;
font-weight:700;
}

.msg{
margin-top:20px;
color:#cbd5e1;
font-size:1.1rem;
}

@keyframes float{
50%{
transform:translateY(-12px);
}
}
</style>
</head>
<body>

<div class="card">

<div class="trophy">🏆</div>

<div class="winner">CHAMPION</div>

<div class="team">🔥 FIRE FOX 🔥</div>

<div class="prize">
💰 Prize Won: 300 BDT
</div>

<div class="msg">
Congratulations Fire Fox for becoming the Champion of Empire Esports Grand Final.
</div>

</div>

</body>
</html>
